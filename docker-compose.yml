services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fcg-pagamentos-sqlserver
    environment:
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:?Defina SA_PASSWORD no arquivo .env (veja .env.example)}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1435:1433"
    volumes:
      - pagamentos_sqlserver_data:/var/opt/mssql
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: fcg-pagamentos-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:?Defina RABBITMQ_USER no arquivo .env (veja .env.example)}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env (veja .env.example)}"
    ports:
      - "5674:5672"
      - "15674:15672"
    volumes:
      - pagamentos_rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: fcg-pagamentos-mongodb
    ports:
      - "27019:27017"
    volumes:
      - pagamentos_mongodb_data:/data/db
    restart: unless-stopped

volumes:
  pagamentos_sqlserver_data:
  pagamentos_rabbitmq_data:
  pagamentos_mongodb_data:
