services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fcg-pagamentos-sqlserver
    environment:
      SA_PASSWORD: "FCG@Pass123"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1435:1433"
    volumes:
      - pagamentos_sqlserver_data:/var/opt/mssql
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: fcg-pagamentos-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
    ports:
      - "5674:5672"
      - "15674:15672"
    volumes:
      - pagamentos_rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  pagamentos_sqlserver_data:
  pagamentos_rabbitmq_data: